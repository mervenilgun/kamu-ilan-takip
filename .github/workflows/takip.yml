name: Kamu Ilan Takip ve Web Paneli

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  takip:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: İlan Tarayıcısını Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ilan_takip_botu.py

      - name: Geçmişi ve Web Paneli Verisini Kaydet
        run: |
          git config --local user.email "bot@users.noreply.github.com"
          git config --local user.name "Kamu Ilan Botu"
          git add gonderilenler.json docs/data.json
          git diff --staged --quiet || git commit -m "chore: ilanlar ve web paneli guncellendi"
          git push
